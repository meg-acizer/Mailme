<svg width="36" height="32" viewBox="0 0 36 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo de contraste redondeado para favicons oscuros y claros -->
  <rect width="36" height="32" rx="7" fill="#0f172a" />
  
  <!-- Nodo circular azul cobalto -->
  <circle cx="18" cy="8.5" r="4.2" fill="#2563eb" />
  
